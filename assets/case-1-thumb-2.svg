    <g transform="translate(68,100)"><circle r="3" fill="#A855F7"></circle><text y="22" text-anchor="middle">D+3</text></g>
    <g transform="translate(116,100)"><circle r="3" fill="#A855F7"></circle><text y="22" text-anchor="middle">D+6</text></g>
