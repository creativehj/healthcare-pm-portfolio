<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#0A0A0A"></rect>
  <text x="16" y="22" fill="#A855F7" font-family="Pretendard,sans-serif" font-size="9" font-weight="800" letter-spacing="3">PROTOCOL TIMELINE</text>
  
  <line x1="20" y1="100" x2="304" y2="100" stroke="#333" stroke-width="1"></line>
  <g font-family="ui-monospace,monospace" font-size="8" fill="#888">
